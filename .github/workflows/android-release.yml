name: Build Release (APK & AAB)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab (امکان اجرای دستی از بخش Actions در گیتهاب)

jobs:
  build:
    name: Build Android Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        # این مرحله کدهای پروژه را از گیتهاب واکشی میکند

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
        # تنظیم نسخه ۲۱ جاوا که با تنظیمات اندروید این پروژه کاملا سازگار است

      - name: Create .env and Configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi

          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"sample-project","storage_bucket":"sample-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1234567890123456","android_client_info":{"package_name":"com.codebaz.videodownloader.mkvpzx"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForGoogleServicesBuild"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi
        # ایجاد فایل .env و google-services.json برای جلوگیری از خطای سکرت و سرویس‌های گوگل

      - name: Decode Release Keystore
        env:
          RELEASE_KEY_BASE64: ${{ secrets.RELEASE_KEY_BASE64 }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ALIAS="${KEY_ALIAS:-releaseKey}"
          PASS="${STORE_PASSWORD:-android}"
          KEYPASS="${KEY_PASSWORD:-$PASS}"

          KEY_SECRET="${RELEASE_KEY_BASE64:-$SIGNING_KEY}"

          if [ -f my-release-key.base64 ]; then
            base64 -d my-release-key.base64 > release.keystore 2>/dev/null || true
            echo "Keystore decoded successfully from base64 file."
          elif [ -n "$KEY_SECRET" ]; then
            CLEAN_KEY=$(echo "$KEY_SECRET" | tr -d ' \n\r\t')
            echo "$CLEAN_KEY" | base64 --decode > release.keystore 2>/dev/null || \
            echo "$CLEAN_KEY" | base64 -d > release.keystore 2>/dev/null || \
            printf '%s' "$KEY_SECRET" > release.keystore
            echo "Keystore decoded successfully from GitHub Secrets."
          fi

          if [ ! -s release.keystore ] || ! keytool -list -keystore release.keystore -storepass "$PASS" >/dev/null 2>&1; then
            echo "No valid custom keystore found. Generating a valid release keystore..."
            rm -f release.keystore
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storetype PKCS12 \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASS" \
              -keypass "$KEYPASS" \
              -dname "CN=InstagramDownloader, OU=Dev, O=App, L=City, ST=State, C=US"
          fi

          cp release.keystore my-release-key.jks 2>/dev/null || true
          cp release.keystore debug.keystore 2>/dev/null || true
        # بازسازی یا تولید کلید ساین برنامه‌ها به همراه بک‌آپ برای تضمین اجرا روی تمام دستگاه‌ها

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
        # این اکشن رسمی گریدل است که کش فایلها و متعلقات بیلد را مدیریت میکند تا سرعت بیلد بالا رود. بررسی صحت رپر به علت تفاوت در محیط بیلد غیرفعال شده است.

      - name: Fix Corrupt Gradle Wrapper
        run: |
          if ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            if command -v gradle >/dev/null 2>&1; then
              echo "Using pre-installed Gradle to regenerate wrapper..."
              rm -f gradle/wrapper/gradle-wrapper.jar
              gradle wrapper --gradle-version 9.3.1
            else
              echo "Gradle not found. Downloading wrapper JAR using curl..."
              rm -f gradle/wrapper/gradle-wrapper.jar
              curl -sSLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar
            fi
          fi
        # برطرف کردن خودکار خطای رپر گریدل خراب یا نامعتبر با بازسازی/دانلود مجدد آن در محیط رانر

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew
        # اعطای دسترسی اجرایی به اسکریپت گریدل

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            --no-daemon \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        # اجرای بیلد نسخه نهایی APK و AAB به همراه ساین و امضا با ریلیز کی موجود در پروژه

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: app/build/outputs/apk/release/*.apk
        # آپلود فایل خروجی APK به عنوان آرتیفکت گیتهاب جهت دانلود راحت شما

      - name: Upload Release AAB (App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
        # آپلود فایل خروجی AAB جهت انتشار در گوگل‌پلی

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

