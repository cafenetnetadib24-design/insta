name: Android Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Ensure Valid Gradle Wrapper Jar
        run: |
          if ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Gradle wrapper JAR is corrupted or missing. Repairing with system gradle..."
            gradle wrapper --gradle-version 8.7
          fi

      - name: Prepare Release Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ALIAS="${KEY_ALIAS:-releaseKey}"
          PASS="${STORE_PASSWORD:-android}"
          KEYPASS="${KEY_PASSWORD:-android}"

          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | tr -d ' \n\r' | base64 -d > release.keystore
            if keytool -list -keystore release.keystore -storepass "$PASS" >/dev/null 2>&1; then
              echo "Custom SIGNING_KEY secret decoded and validated successfully."
            else
              echo "SIGNING_KEY secret failed validation with provided password. Removing corrupted file..."
              rm -f release.keystore
            fi
          fi

          if [ ! -f "release.keystore" ] || [ ! -s "release.keystore" ]; then
            echo "Generating release keystore with alias=$ALIAS..."
            rm -f release.keystore
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASS" \
              -keypass "$KEYPASS" \
              -dname "CN=InstagramDownloader, OU=Dev, O=App, L=City, ST=State, C=US"
            echo "Release keystore ready."
          fi

          touch .env

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            --no-daemon \
            -x lintVitalRelease \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
