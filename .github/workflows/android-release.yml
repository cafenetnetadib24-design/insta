name: Android Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Ensure Valid Gradle Wrapper Jar
        run: |
          if ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Gradle wrapper JAR is corrupted or missing. Repairing with system gradle..."
            gradle wrapper --gradle-version 9.3.1
          fi

      - name: Prepare Release Keystore and Environment
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ALIAS="${KEY_ALIAS:-releaseKey}"
          PASS="${STORE_PASSWORD:-android}"
          KEYPASS="${KEY_PASSWORD:-android}"

          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | tr -d ' \n\r' | base64 -d > release.keystore 2>/dev/null || true
            if [ -s release.keystore ] && keytool -list -keystore release.keystore -storepass "$PASS" -alias "$ALIAS" >/dev/null 2>&1; then
              echo "Custom SIGNING_KEY secret decoded and validated successfully for alias '$ALIAS'."
            else
              echo "SIGNING_KEY base64 decode or alias '$ALIAS' validation failed. Trying raw secret..."
              printf '%s' "$SIGNING_KEY" > release.keystore
              if [ -s release.keystore ] && keytool -list -keystore release.keystore -storepass "$PASS" -alias "$ALIAS" >/dev/null 2>&1; then
                echo "Custom SIGNING_KEY secret validated successfully as raw keystore file for alias '$ALIAS'."
              else
                echo "SIGNING_KEY secret is corrupted or alias '$ALIAS'/password mismatch. Removing invalid file..."
                rm -f release.keystore
              fi
            fi
          fi

          if [ ! -f "release.keystore" ] || [ ! -s "release.keystore" ]; then
            echo "Generating release keystore with alias=$ALIAS..."
            rm -f release.keystore
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASS" \
              -keypass "$KEYPASS" \
              -dname "CN=InstagramDownloader, OU=Dev, O=App, L=City, ST=State, C=US"
            echo "Release keystore ready."
          fi

          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Custom google-services.json provided via secrets."
          fi

          if [ ! -f "app/google-services.json" ]; then
            echo "Generating default app/google-services.json..."
            echo '{"project_info":{"project_number":"123456789012","project_id":"sample-project","storage_bucket":"sample-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1234567890123456","android_client_info":{"package_name":"com.aistudio.videodownloader.mkvpzx"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForGoogleServicesBuild"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

          if [ -f ".env.example" ]; then
            cp -n .env.example .env || true
          else
            touch .env
          fi

          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew clean assembleRelease bundleRelease \
            --no-daemon \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
